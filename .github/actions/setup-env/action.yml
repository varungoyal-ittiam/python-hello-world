name: 'Setup Python Environment'
description: 'Checkout repository, set up Python, and upgrade pip'
inputs:
  python-version:
    description: 'Python version to set up'
    required: false
    default: '3.10'
runs:
  using: 'composite'
  steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Upgrade pip
      shell: bash
      run: |
        python -m pip install --upgrade pip
