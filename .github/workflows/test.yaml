name: CI Checks

on: [push, pull_request]

jobs:
  checks:
    name: Run CI Checks
    # Pinning to a specific LTS release (ubuntu-24.04) prevents unexpected breaking 
    # changes when GitHub rolls out updates to the 'ubuntu-latest' label.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pylint mypy

      - name: Run Linter (pylint)
        run: pylint --rcfile=.pylintrc .

      - name: Run Type Checker (mypy)
        # 'if: always()' forces mypy to run even if the linter fails
        if: always()
        run: mypy .
